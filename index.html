<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#080706">
<title>Happy Birthday HAMID</title>

<script src="config.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#080706;
    color:#f7ead0;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    overflow:hidden;
}

button{
    font:inherit;
}

.screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,#302315 0%,#15110d 35%,#080706 75%);
}

.screen::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(115deg,transparent 35%,rgba(255,215,150,.05),transparent 65%);
}

.hidden{
    display:none!important;
}

/* LOCK */

.lock{
    width:min(90%,430px);
    text-align:center;
    position:relative;
    z-index:2;
    animation:entrance 1.1s ease both;
}

.small-label{
    letter-spacing:6px;
    font-size:11px;
    color:#c9a66b;
    margin-bottom:20px;
    text-transform:uppercase;
}

.lock h1{
    font-size:clamp(42px,13vw,72px);
    letter-spacing:8px;
    font-weight:400;
    margin-bottom:10px;
}

.lock-date{
    color:#b9a789;
    letter-spacing:3px;
    font-size:13px;
    margin-bottom:35px;
}

.password{
    width:100%;
    height:58px;
    border:1px solid rgba(213,177,112,.45);
    background:rgba(255,255,255,.035);
    color:#f8ecd7;
    text-align:center;
    outline:none;
    font-size:20px;
    letter-spacing:8px;
    border-radius:4px;
}

.password:focus{
    border-color:#d8b36e;
}

.primary{
    margin-top:18px;
    width:100%;
    min-height:54px;
    border:1px solid #b9955a;
    background:linear-gradient(135deg,#d7b36d,#9e763c);
    color:#100d08;
    font-weight:bold;
    letter-spacing:3px;
    border-radius:4px;
    cursor:pointer;
}

.error{
    color:#d68c7d;
    margin-top:14px;
    min-height:18px;
    font-size:13px;
}

/* PAGE */

.page{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
    animation:pageIn .75s ease both;
}

.eyebrow{
    color:#c9a66b;
    font-size:10px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.title{
    font-size:clamp(42px,13vw,82px);
    font-weight:400;
    letter-spacing:7px;
    line-height:.95;
}

.subtitle{
    margin-top:20px;
    color:#b7a991;
    font-family:Arial,sans-serif;
    font-size:13px;
    letter-spacing:2px;
    line-height:1.8;
    max-width:500px;
}

.action{
    margin-top:32px;
    padding:15px 28px;
    border:1px solid #b9955a;
    background:transparent;
    color:#e7c98f;
    letter-spacing:3px;
    font-size:11px;
    cursor:pointer;
    border-radius:3px;
}

.action:active{
    transform:scale(.97);
}

.next{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    min-width:145px;
    padding:14px 24px;
    border:1px solid #b9955a;
    background:#b9955a;
    color:#100d08;
    letter-spacing:3px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
    border-radius:3px;
    animation:fadeUp .5s ease both;
}

/* CAKE */

.cake-area{
    position:relative;
    width:310px;
    height:260px;
    margin-top:15px;
}

.cake{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:230px;
    height:105px;
    background:linear-gradient(#e9d0a0,#b78b4d);
    border-radius:10px 10px 20px 20px;
    box-shadow:0 20px 45px rgba(0,0,0,.5);
    transition:1s ease;
}

.cake::before{
    content:"HAMID";
    position:absolute;
    left:0;
    right:0;
    top:37px;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:25px;
    letter-spacing:4px;
    color:#30200f;
}

.cake::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:-17px;
    height:24px;
    background:#f0dfbd;
    border-radius:50%;
}

.cake.cut{
    transform:translate(-50%,130%);
    opacity:0;
}

.candles{
    position:absolute;
    bottom:135px;
    left:50%;
    transform:translateX(-50%);
    width:190px;
    display:flex;
    justify-content:space-between;
    z-index:3;
}

.candle{
    width:10px;
    height:55px;
    background:linear-gradient(90deg,#c99d59,#f5dfae,#b07e3b);
    position:relative;
    border-radius:2px;
}

.flame{
    position:absolute;
    width:13px;
    height:22px;
    left:50%;
    top:-24px;
    transform:translateX(-50%);
    background:#f6bf58;
    border-radius:70% 35% 70% 35%;
    box-shadow:0 0 15px #f5b94e;
    animation:flicker .35s infinite alternate;
}

.candles.off .flame{
    opacity:0;
    animation:none;
}

.cake-message{
    min-height:22px;
    margin-top:0;
    color:#d6bb83;
    font-family:Arial,sans-serif;
    font-size:13px;
    letter-spacing:2px;
}

/* WISH BOX */

.wish-box{
    position:relative;
    width:260px;
    height:190px;
    margin:30px auto 10px;
    cursor:pointer;
}

.box-body{
    position:absolute;
    bottom:0;
    left:20px;
    width:220px;
    height:130px;
    background:linear-gradient(135deg,#8c6738,#d4ad68,#79552e);
    border-radius:6px;
    box-shadow:0 25px 50px rgba(0,0,0,.5);
}

.box-lid{
    position:absolute;
    left:12px;
    top:42px;
    width:236px;
    height:48px;
    background:linear-gradient(135deg,#a57b42,#e1bd78,#876135);
    border-radius:5px;
    z-index:2;
    transform-origin:left bottom;
    transition:1s ease;
}

.wish-box.open .box-lid{
    transform:rotate(-27deg) translate(-8px,-28px);
}

.wishes{
    position:absolute;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) scale(.7);
    width:190px;
    padding:18px;
    background:#f5e8cd;
    color:#382816;
    opacity:0;
    transition:1s ease .35s;
    z-index:1;
}

.wish-box.open .wishes{
    opacity:1;
    transform:translateX(-50%) scale(1);
}

/* GIFT */

.gift{
    position:relative;
    width:230px;
    height:210px;
    margin:30px auto;
    cursor:pointer;
}

.gift-body{
    position:absolute;
    bottom:10px;
    left:25px;
    width:180px;
    height:135px;
    background:linear-gradient(135deg,#77552f,#d0a762,#815d34);
    border-radius:5px;
    box-shadow:0 25px 45px rgba(0,0,0,.55);
}

.gift-lid{
    position:absolute;
    left:15px;
    top:45px;
    width:200px;
    height:45px;
    background:linear-gradient(135deg,#a77b42,#e1bd7a,#896336);
    border-radius:5px;
    z-index:3;
    transition:1s ease;
}

.gift.open .gift-lid{
    transform:translateY(-80px) rotate(-4deg);
    opacity:.2;
}

.ribbon-v{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:28px;
    height:100%;
    background:#b58c4d;
}

.ribbon-h{
    position:absolute;
    top:40%;
    left:0;
    width:100%;
    height:25px;
    background:#b58c4d;
}

.card{
    position:absolute;
    z-index:2;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(80px);
    width:170px;
    min-height:125px;
    padding:20px 12px;
    background:#f5e7ca;
    color:#382716;
    opacity:0;
    transition:1s ease .3s;
}

.gift.open .card{
    transform:translateX(-50%) translateY(-15px);
    opacity:1;
}

/* PHOTOS */

.photo-frame{
    width:min(82vw,330px);
    height:min(65vh,390px);
    margin:20px auto;
    padding:9px;
    background:linear-gradient(135deg,#d8b77a,#76542e,#d8b77a);
    box-shadow:0 30px 70px rgba(0,0,0,.6);
    opacity:0;
    transform:scale(.9);
    transition:1s ease;
}

.photo-frame.show{
    opacity:1;
    transform:scale(1);
}

.photo-frame img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#18130d;
}

.photo-count{
    color:#a89575;
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:3px;
}

/* FINAL CARD */

.final-card{
    width:min(88vw,500px);
    min-height:310px;
    padding:42px 28px;
    border:1px solid rgba(214,177,105,.6);
    background:
        linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));
    box-shadow:0 35px 80px rgba(0,0,0,.6);
    transform:scale(.88);
    opacity:0;
    transition:1s ease;
}

.final-card.show{
    transform:scale(1);
    opacity:1;
}

.final-card h2{
    font-size:clamp(34px,10vw,58px);
    letter-spacing:5px;
    font-weight:400;
    margin:20px 0;
}

.final-card p{
    color:#b9aa90;
    font-family:Arial,sans-serif;
    font-size:13px;
    line-height:1.9;
}

/* ANIMATION */

@keyframes entrance{
    from{opacity:0;transform:translateY(25px)}
    to{opacity:1;transform:none}
}

@keyframes pageIn{
    from{opacity:0;transform:scale(1.025)}
    to{opacity:1;transform:scale(1)}
}

@keyframes fadeUp{
    from{opacity:0;transform:translate(-50%,15px)}
    to{opacity:1;transform:translate(-50%,0)}
}

@keyframes flicker{
    from{transform:translateX(-50%) scale(.9) rotate(-4deg)}
    to{transform:translateX(-50%) scale(1.1) rotate(4deg)}
}

@media(max-height:650px){
    .cake-area{
        transform:scale(.82);
        margin:-15px 0;
    }

    .wish-box,.gift{
        transform:scale(.8);
        margin:-5px auto;
    }

    .photo-frame{
        height:48vh;
    }
}
</style>
</head>

<body>

<audio id="music" loop preload="auto">
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<div id="app"></div>

<script>
/* =========================
   BASIC SETUP
========================= */

const cfg = BIRTHDAY_CONFIG;

const app = document.getElementById("app");
const music = document.getElementById("music");

const params = new URLSearchParams(window.location.search);
let page = parseInt(params.get("page") || "0",10);

if(page < 0 || page > 5) page = 0;

let completed = false;

function nextPage(){
    if(!completed) return;

    const next = page + 1;

    if(next <= 5){
        window.location.href = "index.html?page=" + next;
    }else{
        window.location.href = "index.html?page=0";
    }
}

function nextButton(){
    return `
        <button class="next" id="nextBtn">
            NEXT
        </button>
    `;
}

function showNext(){
    completed = true;

    const old = document.getElementById("nextBtn");

    if(old) old.remove();

    app.insertAdjacentHTML("beforeend",nextButton());

    document.getElementById("nextBtn").onclick = nextPage;
}

/* =========================
   PASSWORD PAGE
========================= */

function renderLock(){

    app.innerHTML = `
        <main class="screen">
            <section class="lock">

                <div class="small-label">
                    A Private Celebration
                </div>

                <h1>${cfg.name}</h1>

                <div class="lock-date">
                    ${cfg.date}
                </div>

                <input
                    id="password"
                    class="password"
                    type="password"
                    inputmode="numeric"
                    maxlength="12"
                    placeholder="••••"
                >

                <button id="unlock" class="primary">
                    ENTER EXPERIENCE
                </button>

                <div id="error" class="error"></div>

            </section>
        </main>
    `;

    const input = document.getElementById("password");
    const button = document.getElementById("unlock");

    function unlock(){

        if(input.value === cfg.password){

            try{
                music.volume = 0.42;
                music.play();
            }catch(e){}

            window.location.href = "index.html?page=1";

        }else{
            document.getElementById("error").textContent =
                "Password incorrect";
        }
    }

    button.onclick = unlock;

    input.addEventListener("keydown",e=>{
        if(e.key === "Enter") unlock();
    });
}

/* =========================
   PAGE 1 — INTRO
========================= */

function renderIntro(){

    app.innerHTML = `
        <main class="screen">
            <section class="page">

                <div class="eyebrow">
                    The Day Is Yours
                </div>

                <h1 class="title">
                    HAPPY<br>
                    BIRTHDAY
                </h1>

                <p class="subtitle">
                    Today isn't just another date.<br>
                    It's a celebration of you.
                </p>

                <button class="action" id="revealIntro">
                    REVEAL
                </button>

            </section>
        </main>
    `;

    document.getElementById("revealIntro").onclick = ()=>{

        document.querySelector(".subtitle").innerHTML =
            `For <strong>${cfg.name}</strong><br>
             With wishes that last beyond today.`;

        document.getElementById("revealIntro").remove();

        setTimeout(showNext,500);
    };
}

/* =========================
   PAGE 2 — CAKE
========================= */

function renderCake(){

    app.innerHTML = `
        <main class="screen">
            <section class="page">

                <div class="eyebrow">
                    Make A Wish
                </div>

                <h1 class="title" style="font-size:42px">
                    YOUR<br>CAKE
                </h1>

                <div class="cake-area">

                    <div class="candles" id="candles">

                        <div class="candle">
                            <span class="flame"></span>
                        </div>

                        <div class="candle">
                            <span class="flame"></span>
                        </div>

                        <div class="candle">
                            <span class="flame"></span>
                        </div>

                        <div class="candle">
                            <span class="flame"></span>
                        </div>

                        <div class="candle">
                            <span class="flame"></span>
                        </div>

                    </div>

                    <div class="cake" id="cake"></div>

                </div>

                <div class="cake-message" id="cakeMessage">
                    Five candles. One wish.
                </div>

                <button class="action" id="blow">
                    BLOW CANDLES
                </button>

            </section>
        </main>
    `;

    document.getElementById("blow").onclick = ()=>{

        document.getElementById("candles")
            .classList.add("off");

        document.getElementById("cakeMessage").textContent =
            "The wish is yours. Now cut the cake.";

        const blow = document.getElementById("blow");

        blow.textContent = "CUT CAKE";
        blow.id = "cut";

        document.getElementById("cut").onclick = ()=>{

            document.getElementById("cake").classList.add("cut");

            document.getElementById("cakeMessage").textContent =
                "Happy Birthday, HAMID.";

            setTimeout(showNext,1100);
        };
    };
}

/* =========================
   PAGE 3 — WISH BOX
========================= */

function renderWishes(){

    app.innerHTML = `
        <main class="screen">
            <section class="page">

                <div class="eyebrow">
                    Sealed With Good Wishes
                </div>

                <h1 class="title" style="font-size:42px">
                    YOUR<br>WISHES
                </h1>

                <div class="wish-box" id="wishBox">

                    <div class="wishes">
                        <b>For HAMID</b><br><br>
                        May every new chapter bring
                        you happiness, success,
                        peace and unforgettable
                        moments.
                    </div>

                    <div class="box-body"></div>
                    <div class="box-lid"></div>

                </div>

                <button class="action" id="openWish">
                    OPEN WISHES
                </button>

            </section>
        </main>
    `;

    document.getElementById("openWish").onclick = ()=>{

        document.getElementById("wishBox")
            .classList.add("open");

        document.getElementById("openWish").remove();

        setTimeout(showNext,1400);
    };
}

/* =========================
   PAGE 4 — GIFT
========================= */

function renderGift(){

    app.innerHTML = `
        <main class="screen">

            <section class="page">

                <div class="eyebrow">
                    Something Special
                </div>

                <h1 class="title" style="font-size:42px">
                    A GIFT<br>FOR YOU
                </h1>

                <div class="gift" id="gift">

                    <div class="card">
                        <div class="eyebrow" style="color:#9a713c">
                            Birthday Card
                        </div>

                        <h3 style="font-size:25px">
                            HAMID
                        </h3>

                        <p style="margin-top:12px;font-family:Arial;font-size:11px;line-height:1.6">
                            Keep smiling.<br>
                            Keep growing.<br>
                            Keep becoming.
                        </p>
                    </div>

                    <div class="gift-body">
                        <div class="ribbon-v"></div>
                        <div class="ribbon-h"></div>
                    </div>

                    <div class="gift-lid">
                        <div class="ribbon-v"></div>
                    </div>

                </div>

                <button class="action" id="openGift">
                    OPEN GIFT
                </button>

            </section>

        </main>
    `;

    document.getElementById("openGift").onclick = ()=>{

        document.getElementById("gift")
            .classList.add("open");

        document.getElementById("openGift").remove();

        setTimeout(showNext,1300);
    };
}

/* =========================
   PAGE 5 — PHOTOS
========================= */

function renderPhotos(){

    app.innerHTML = `
        <main class="screen">

            <section class="page">

                <div class="eyebrow">
                    A Few Memories
                </div>

                <h1 class="title" style="font-size:42px">
                    MEMORIES
                </h1>

                <div class="photo-frame" id="photoFrame">
                    <img id="memoryImage" alt="Memory">
                </div>

                <div class="photo-count" id="photoCount">
                    MEMORY 01
                </div>

                <button class="action" id="revealPhoto">
                    REVEAL MEMORIES
                </button>

            </section>

        </main>
    `;

    let current = 0;

    const frame = document.getElementById("photoFrame");
    const img = document.getElementById("memoryImage");
    const count = document.getElementById("photoCount");
    const button = document.getElementById("revealPhoto");

    button.onclick = ()=>{

        frame.classList.add("show");

        img.src = cfg.images[current];

        let timer = setInterval(()=>{

            current++;

            if(current >= cfg.images.length){

                clearInterval(timer);

                current = cfg.images.length - 1;

                setTimeout(showNext,800);

                return;
            }

            img.style.opacity = "0";

            setTimeout(()=>{

                img.src = cfg.images[current];

                img.onload = ()=>{
                    img.style.opacity = "1";
                };

                count.textContent =
                    "MEMORY " +
                    String(current+1).padStart(2,"0");

            },350);

        },1800);

        button.remove();
    };
}

/* =========================
   PAGE 6 — FINAL CARD
========================= */

function renderFinal(){

    app.innerHTML = `
        <main class="screen">

            <section class="page">

                <div class="final-card" id="finalCard">

                    <div class="eyebrow">
                        September 19, 2026
                    </div>

                    <h2>
                        HAPPY<br>
                        BIRTHDAY
                    </h2>

                    <div style="
                        width:55px;
                        height:1px;
                        background:#b9955a;
                        margin:22px auto;
                    "></div>

                    <p>
                        HAMID, may this year bring
                        you new dreams, meaningful
                        moments and reasons to smile.
                    </p>

                    <p style="margin-top:16px;color:#d0b47b">
                        This day is yours.
                    </p>

                </div>

                <button class="action" id="openFinal">
                    OPEN YOUR CARD
                </button>

            </section>

        </main>
    `;

    document.getElementById("openFinal").onclick = ()=>{

        document.getElementById("finalCard")
            .classList.add("show");

        document.getElementById("openFinal").textContent =
            "CELEBRATE";

        document.getElementById("openFinal").onclick = ()=>{

            completed = true;

            document.getElementById("openFinal").remove();

            const celebration = document.createElement("div");

            celebration.style.cssText = `
                position:absolute;
                inset:0;
                display:flex;
                align-items:center;
                justify-content:center;
                flex-direction:column;
                background:rgba(8,7,6,.82);
                z-index:20;
                animation:entrance .8s ease both;
            `;

            celebration.innerHTML = `
                <div class="eyebrow">
                    19 • 09 • 2026
                </div>

                <div class="title" style="font-size:55px">
                    HAMID
                </div>

                <p class="subtitle">
                    HAPPY BIRTHDAY
                </p>
            `;

            document.querySelector(".page")
                .appendChild(celebration);
        };
    };
}

/* =========================
   PAGE SELECTOR
========================= */

switch(page){

    case 0:
        renderLock();
        break;

    case 1:
        renderIntro();
        break;

    case 2:
        renderCake();
        break;

    case 3:
        renderWishes();
        break;

    case 4:
        renderGift();
        break;

    case 5:
        renderPhotos();
        break;

    case 6:
        renderFinal();
        break;

    default:
        renderLock();
}

/*
NOTE:
page 6 is final even though the normal range check
allows it. The selector intentionally supports 0-6.
*/
</script>

</body>
</html>
